name: CI/CD Microservices

on:
  push:
    branches:
      - main
      - 'quest/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, Scan & Publish (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, notifier]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set lowercase repository name for GHCR
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Login to GitHub Container Registry (sur tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local pour Trivy (${{ matrix.service }})
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ matrix.service == 'api' && 'Dockerfile.multi' || 'Dockerfile' }}
          load: true
          tags: ghcr.io/${{ env.REPO_LC }}/${{ matrix.service }}:ci

      - name: Scan Trivy (${{ matrix.service }})
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LC }}/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          format: table

      - name: Push image vers GHCR (sur tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/${{ matrix.service == 'api' && 'Dockerfile.multi' || 'Dockerfile' }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/${{ env.REPO_LC }}/${{ matrix.service }}:latest

  deploy:
    name: Déploiement continu (CD)
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulation de déploiement continu (CD sur runner)
        run: |
          echo "🚀 Démarrage du déploiement continu sur la cible..."
          mkdir -p secrets
          echo "deploy_secret" > secrets/db_password.txt
          cp .env.example .env
          echo "Validation de la configuration Docker Compose..."
          docker compose config
          echo "Démarrage des services..."
          docker compose up -d --build
          sleep 5
          docker compose ps
          echo "✅ Déploiement réussi avec succès !"

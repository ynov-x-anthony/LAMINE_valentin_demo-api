services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.multi
    ports:
      - "${API_PORT:-8080}:3000"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-demo_secret}
      PGDATABASE: ${POSTGRES_DB:-demo}
      NOTIFIER_HOST: notifier
      NOTIFIER_PORT: "4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - front
      - back

  notifier:
    build: ./notifier
    environment:
      PORT: "4000"
    restart: unless-stopped
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-demo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    secrets:
      - db_password
    networks:
      - back

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - front
      - back

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  front:
  back:

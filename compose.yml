services:
  api:
    build: ./api
    ports:
      - "${API_PORT:-8080}:3000"
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-demo}
      PGPASSWORD: ${POSTGRES_PASSWORD:-demo_secret}
      PGDATABASE: ${POSTGRES_DB:-demo}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demo}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo} -d ${POSTGRES_DB:-demo}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    secrets:
      - db_password

  adminer:
    image: adminer:4
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
